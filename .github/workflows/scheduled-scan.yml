name: Scheduled job scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,7,13,19 * * *"

permissions:
  contents: read

concurrency:
  group: personal-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Best-effort continuity only. GitHub can evict caches, so this is not durable storage.
      - name: Restore previous SQLite state
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Install
        run: python -m pip install .

      - name: Scan
        run: python -m job_discovery --config config/companies.yml scan

      - name: Save current SQLite state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}

      - name: Upload reports and state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-scan-${{ github.run_id }}
          path: |
            reports/latest.md
            reports/latest.json
            data/jobs.db
          if-no-files-found: warn
          retention-days: 14

